<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Nutri FRO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light d-flex align-items-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow">
                    <div class="card-header bg-success p-0">
                        <ul class="nav nav-tabs nav-fill" id="authTabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active text-dark fw-bold" id="login-tab" data-bs-toggle="tab" data-bs-target="#login-pane" type="button" role="tab">Iniciar Sesión</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link text-white" id="register-tab" data-bs-toggle="tab" data-bs-target="#register-pane" type="button" role="tab">Registrarse</button>
                            </li>
                        </ul>
                    </div>
                    <div class="card-body p-4">
                        <div class="tab-content" id="authTabsContent">
                            <div class="tab-pane fade show active" id="login-pane" role="tabpanel" aria-labelledby="login-tab">
                                <h5 class="text-center mb-3">Bienvenido de nuevo</h5>
                                <form id="loginForm">
                                    <div class="mb-3">
                                        <label class="form-label">Nombre del Nutriólogo(a):</label>
                                        <input type="text" class="form-control" id="logName" required autocomplete="off" placeholder="Ej. Dr. Fernando">
                                    </div>
                                    <div class="mb-4">
                                        <label class="form-label">Contraseña:</label>
                                        <input type="password" class="form-control" id="logPass" required>
                                    </div>
                                    <button type="submit" class="btn btn-success w-100">Ingresar al Panel</button>
                                </form>
                            </div>
                            <div class="tab-pane fade" id="register-pane" role="tabpanel" aria-labelledby="register-tab">
                                <h5 class="text-center mb-3">Nuevo Nutriólogo</h5>
                                <form id="registerForm">
                                    <div class="mb-3">
                                        <label class="form-label">Crea tu Nombre de Usuario:</label>
                                        <input type="text" class="form-control" id="regName" required autocomplete="off" placeholder="Ej. Dr. Fernando">
                                    </div>
                                    <div class="mb-4">
                                        <label class="form-label">Crea una Contraseña:</label>
                                        <input type="password" class="form-control" id="regPass" required>
                                    </div>
                                    <button type="submit" class="btn btn-primary w-100">Registrar Cuenta</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        if (sessionStorage.getItem('nutri_user')) {
            window.location.href = 'dashboard.html';
        }

        let usuariosDB = JSON.parse(localStorage.getItem('db_usuarios')) || [];

        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const nuevoNombre = document.getElementById('regName').value;
            const nuevaContra = document.getElementById('regPass').value;

            const usuarioExiste = usuariosDB.find(u => u.nombre.toLowerCase() === nuevoNombre.toLowerCase());
            
            if (usuarioExiste) {
                alert("Este nombre ya está registrado. Por favor, elige otro o inicia sesión.");
                return;
            }

            usuariosDB.push({ nombre: nuevoNombre, password: nuevaContra });
            localStorage.setItem('db_usuarios', JSON.stringify(usuariosDB));
            
            alert("¡Registro exitoso! Ahora puedes iniciar sesión.");
            this.reset(); 
            
            const loginTab = new bootstrap.Tab(document.getElementById('login-tab'));
            loginTab.show();
            
            document.getElementById('login-tab').classList.add('text-dark', 'fw-bold');
            document.getElementById('login-tab').classList.remove('text-white');
            document.getElementById('register-tab').classList.remove('text-dark', 'fw-bold');
            document.getElementById('register-tab').classList.add('text-white');
        });

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const nombreIngresado = document.getElementById('logName').value;
            const contraIngresada = document.getElementById('logPass').value;

            const usuarioValido = usuariosDB.find(u => u.nombre === nombreIngresado && u.password === contraIngresada);

            if (usuarioValido) {
                sessionStorage.setItem('nutri_user', usuarioValido.nombre);
                window.location.href = 'dashboard.html';
            } else {
                alert("Error: Nombre de usuario o contraseña incorrectos.");
            }
        });

        document.querySelectorAll('button[data-bs-toggle="tab"]').forEach(button => {
            button.addEventListener('shown.bs.tab', function (event) {
                event.relatedTarget.classList.remove('text-dark', 'fw-bold');
                event.relatedTarget.classList.add('text-white');
                event.target.classList.remove('text-white');
                event.target.classList.add('text-dark', 'fw-bold');
            });
        });
    </script>
</body>
</html>
