<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Nutri FRO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow">
                    <div class="card-header bg-success text-white text-center">
                        <h4>Clínica Nutri "FRO"</h4>
                    </div>
                    <div class="card-body">
                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="docName" class="form-label">Nombre del Nutriólogo(a):</label>
                                <input type="text" class="form-control" id="docName" required autocomplete="off" placeholder="Ej. Dr. Fernando">
                            </div>
                            <button type="submit" class="btn btn-success w-100">Firmar Entrada</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Si ya hay sesión, redirigir al panel
        if (sessionStorage.getItem('nutri_user')) {
            window.location.href = 'dashboard.html';
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('docName').value;
            sessionStorage.setItem('nutri_user', name); // Guardamos la sesión
            window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
